# libFuzzer targets for krypt (`just fuzz <target> [seconds]`). A workspace
# of its own: it builds with the nightly toolchain of `nix develop .#fuzz`,
# which the main workspace never sees.
[package]
name = "krypt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
krypt-core = { path = "../crates/krypt-core" }
krypt-wire = { path = "../crates/krypt-wire" }
# Already in krypt-core's tree: checks the key packages the mailbox hands out.
openmls = "=0.9.2"
libfuzzer-sys = "=0.4.13"

[lib]
name = "krypt_fuzz"
path = "src/lib.rs"
test = false
doc = false

# Writes the seed corpora (and, asked to, the client fixture). An example,
# not a bin: cargo-fuzz instruments every bin, which then links only against
# a sanitizer runtime.
[[example]]
name = "seeds"
path = "examples/seeds.rs"
test = false
doc = false

[[bin]]
name = "wire_frame"
path = "fuzz_targets/wire_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_msg"
path = "fuzz_targets/wire_msg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scrub_image"
path = "fuzz_targets/scrub_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scrub_mp4"
path = "fuzz_targets/scrub_mp4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scrub_webm"
path = "fuzz_targets/scrub_webm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mailbox"
path = "fuzz_targets/mailbox.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_receive"
path = "fuzz_targets/client_receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_restore"
path = "fuzz_targets/client_restore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity"
path = "fuzz_targets/identity.rs"
test = false
doc = false
bench = false

[profile.release]
debug = "line-tables-only"
