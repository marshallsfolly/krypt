# Every hour: does krypt.chat serve exactly the latest signed release
# (docs/releases.md)? If not, an issue says what differs. It sees what is
# served to everyone, not what might be served to one person.

name: Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare krypt.chat with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-monitor.sh https://krypt.chat
