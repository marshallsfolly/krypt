[workspace]
resolver = "3"
members = ["crates/*", "services/edge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
krypt-wire = { path = "crates/krypt-wire" }
krypt-core = { path = "crates/krypt-core" }
krypt-store = { path = "crates/krypt-store" }
krypt-net = { path = "crates/krypt-net" }
krypt-devmailbox = { path = "crates/krypt-devmailbox" }

# The hybrid post-quantum ciphersuite (X25519 + ML-KEM-768) is behind this
# feature until the IETF assigns its final code point. Not on `openmls`
# itself: there it only widens the default capabilities, and it pulls in a
# second SQLite. Leaves declare their ciphersuite explicitly instead.
openmls = "0.9.2"
openmls_rust_crypto = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
divan = "0.1.21"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
tempfile = "3"
ed25519-dalek = "2.2"
# Already in the tree (OpenMLS uses it); device linking needs X25519 directly.
rand_chacha = "0.3"
rand_core = "0.6"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenMLS state at rest (crates/krypt-core/src/mls_store.rs): compact, with a
# wire format fixed by its 1.0 spec. Without default features it adds only
# `cobs`; the encoding is pinned, so the version is too.
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Dependencies (OpenMLS and its crypto) are optimized even in dev and test
# builds; unoptimized, the simulator spends its time in debug-mode crypto.
[profile.dev.package."*"]
opt-level = 2

# OpenMLS is generic over its provider, so most of its code is instantiated,
# and compiled, in krypt-core: unoptimized, group operations run ~9x slower.
[profile.dev.package.krypt-core]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# The browser core: download size is the web client's cold start.
[profile.wasm]
inherits = "release"
opt-level = "s"
debug = false
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
