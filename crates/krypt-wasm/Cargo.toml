[package]
name = "krypt-wasm"
description = "The krypt device core for browsers and Tauri, via wasm-bindgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
krypt-wire.workspace = true
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
serde.workspace = true
serde-wasm-bindgen = "0.6"
qrcode.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
krypt-core = { workspace = true, features = ["js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
krypt-core.workspace = true

[lints]
workspace = true
